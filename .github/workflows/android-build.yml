name: Build Android APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7-stable"

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate standard Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Point Godot at the Android SDK and debug keystore
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          use_preset_export_path: true
          export_debug: true
          verbose: true
          presets_to_export: "Android"

      - name: Collect the built APK
        run: |
          mkdir -p build
          apk_path=$(find "$HOME/.local/share/godot/builds" build -name "*.apk" -print -quit 2>/dev/null)
          if [ -z "$apk_path" ]; then
            echo "::error::No .apk file found after export"
            exit 1
          fi
          cp "$apk_path" build/gmei.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmei-android-debug-apk
          path: build/gmei.apk
          if-no-files-found: error
          retention-days: 30
